# Per-language guidance for the user_speech_fidelity judge, rendered into its language_guidance slot.
# Based on native-speaker review of EVA runs. See src/eva/metrics/language_guidance.py.
# Generated per language from one source shared with the other speech-fidelity judges; each group
# heading states what its items mean for the rating.

de: |
  **Correct, does not lower the rating:**
  - Letter names in spelled codes: A ah, B beh, C zeh, D deh, E eh, F eff, G geh, H hah, I ih, J jott, K kah, L ell, M emm, N enn, O oh, P peh, Q kuh, R err, S ess, T teh, U uh, V fau, W weh, X iks, Y ypsilon, Z zett; Ä/Ö/Ü as ä/ö/ü. Digits null, eins, zwei (zwo is a valid variant), drei ... neun.
  - Buchstabiertafel words ('D wie Dora', 'Z wie Zeppelin').
  - Units before tens: fünfundsiebzig = 75, vierundzwanzig = 24.
  - Times: 'vierzehn Uhr dreißig', 'halb drei' = 2:30 (not 3:30), 'Viertel nach zwei' = 2:15, 'Viertel vor drei' / 'drei viertel drei' = 2:45, and the regional 'viertel drei' = 2:15.
  - Dates: 'achter November neunzehnhundertneunzig', 'zweitausendsechsundzwanzig'.
  **English letter or digit names in a spelled code: rating at most 2 while the value is still clear; rating 1 (entity error) when the English name sounds like a different German letter.** Typical cases:
  - 'bee-ell-dee' for BLD, 'jay' for J, 'dee' for D, 'six' for 6.
  - These English names sound like a different German letter, so the code changes: English E 'ii' = German I, English A 'ay' ~ German E, English V 'vee' ~ German W 'weh', English J 'jay' ~ German G 'geh'.
  **Rating 1 (entity error):**
  - A name with its umlaut replaced or lost (Böhm said as 'Bohm').
  - A different value: siebenundfünfzig for 75, 'halb drei' for 3:30.
  **Unusual but understandable: rating at most 2 while the value is still clear; rating 1 if a German listener could take it for a different value:**
  - A date read as digit groups a German listener cannot parse as a date ('neunzehn neunzig, zwei, Monat elf').
  **Letters and digits that sound alike: rating 1 only if the audio itself is ambiguous between the two; do not lower the rating because your own transcription shows the other one:**
  - D/E/G/T (deh/eh/geh/teh), B/P, M/N, F/S; zwei/drei (2/3), which is why careful speakers say 'zwo'.
  **Not wrong language, does not lower the rating:**
  - Proper nouns, official product or system names, codes and acronyms, and established loanwords (Ticket, Login, Account, Laptop).
  - A half-English pronunciation of a German word ('Perfekt'): this is accent.

nl: |
  **Correct, does not lower the rating:**
  - Letter names in spelled codes: A aa, B bee, C cee, D dee, E ee, F ef, G gee (Dutch g), H haa, I ie, J jee, K kaa, L el, M em, N en, O oo, P pee, Q kuu, R er, S es, T tee, U uu, V vee, W wee, X iks, Y ij / griekse ij / ypsilon, Z zet; IJ may be said as one letter.
  - The names bee, cee, dee, pee, tee are written like English letter names but are the Dutch names (Dutch B is /beː/, close to English 'bay'): they are not English.
  - Units before tens: vijfenzeventig = 75, zesentwintig = 26.
  - 2026 as 'tweeduizendzesentwintig' or 'twintig zesentwintig'.
  - Times: 'half drie' = 2:30 (not 3:30), 'kwart over twee' = 2:15, 'kwart voor drie' = 2:45, 'tien voor half drie' = 2:20, 'veertien uur dertig'.
  **English letter or digit names in a spelled code: rating at most 2 while the value is still clear; rating 1 (entity error) when the English name sounds like a different Dutch letter.** Typical cases:
  - 'ay', 'aitch', 'jay', 'kay', 'ar', 'you', 'double-u', 'why', 'zee', 'six', 'one'.
  - These English names sound like a different Dutch letter, so the code changes: English E 'ee' = Dutch I 'ie', English A 'ay' ~ Dutch E 'ee', English I 'eye' ~ Dutch IJ.
  **Rating 1 (entity error):**
  - A vowel change that makes a digit unrecognisable or turns it into another digit.
  - A different value: 'half drie' for 3:30.
  **Letters and digits that sound alike: rating 1 only if the audio itself is ambiguous between the two; do not lower the rating because your own transcription shows the other one:**
  - V/F (Dutch v is often devoiced), G/CH, M/N, B/P, D/T; zeven/negen (7/9), which is why telephone speech uses 'zeuven'.
  **Same sound, cannot be told apart from audio: never lower the rating for these alone; use the intended text to know which was meant:**
  - EI and IJ in names.
  **Not wrong language, does not lower the rating:**
  - Proper nouns, official product or system names, codes and acronyms, and established loanwords, including 'sorry' and 'oké', which are standard Dutch.
  - Acronyms used as words or names (ID, FMLA, I-9) said with English letter names; Dutch names ('ie-dee') are preferred. The letters of a spelled code or identifier still need Dutch names.

fr: |
  **Correct, does not lower the rating:**
  - Letter names in spelled codes: A a, B bé, C cé, D dé, E e (schwa), F effe, G gé, H ache, I i, J ji, K ka, L elle, M emme, N enne, O o, P pé, Q ku, R erre, S esse, T té, U u (French u), V vé, W double-vé, X iks, Y i grec, Z zède. Digits zéro, un, deux, trois ... six (said 'sis'), sept, huit, neuf.
  - Spelling words ('A comme Anatole', 'M comme Marcel').
  - Numbers: 70 soixante-dix, 77 soixante-dix-sept, 80 quatre-vingts, 91 quatre-vingt-onze. Liaison (six heures, dix-huit).
  - Times: 'quinze heures trente', 'trois heures et demie', 'trois heures et quart' = 3:15, 'trois heures moins le quart' = 2:45, 'midi', 'minuit'.
  - Dates and years: 'le premier mars', 'deux mille vingt-six', 'mille neuf cent quatre-vingt-dix' or 'dix-neuf cent quatre-vingt-dix'.
  - Z said 'zed' (common in Québec): this is not English.
  - Québec times: 'trois heures moins quart' (without 'le') = 2:45 and the colloquial 'quart à trois' = 2:45.
  **English letter or digit names in a spelled code: rating at most 2 while the value is still clear; rating 1 (entity error) when the English name sounds like a different French letter.** Typical cases:
  - 'bee' for B, 'jay', 'double-u', 'six' with an English 'ks', 'two', INC or EMP spelled with English names.
  - These English names sound like a different French letter, so the code changes: English G 'djee' ~ French J 'ji', English J 'djay' ~ French G 'gé', English E 'ii' = French I.
  **Rating 1 (entity error):**
  - A different value: soixante-sept for 77, 'moins le quart' for 3:45.
  **Unusual but understandable: rating at most 2 while the value is still clear; rating 1 if a French listener could take it for a different value:**
  - 'le un mars' instead of 'le premier mars'.
  **Letters and digits that sound alike: rating 1 only if the audio itself is ambiguous between the two; do not lower the rating because your own transcription shows the other one:**
  - M/N (emme/enne), B/D/P/T (bé/dé/pé/té), G/J (gé/ji), F/S (effe/esse).
  **Not wrong language, does not lower the rating:**
  - Established loanwords: ticket, e-mail, week-end, OK.

es: |
  **Correct, does not lower the rating:**
  - Letter names in spelled codes: A a, B be, C ce, D de, E e, F efe, G ge, H hache, I i, J jota, K ka, L ele, M eme, N ene, Ñ eñe, O o, P pe, Q cu, R erre, S ese, T te, U u, V uve (also ve), W uve doble / doble ve / doble u, X equis, Y i griega / ye, Z zeta. Digits cero, uno, dos ... nueve.
  - Spelling words ('M de Madrid', 'B de Barcelona', 'be larga', 've corta').
  - Times: 'las quince treinta', 'las tres y media', 'las tres menos cuarto' = 2:45.
  - Dates and years: 'el uno de marzo' and 'el primero de marzo', 'dos mil veintiséis', 'mil novecientos noventa'.
  **English letter or digit names in a spelled code: rating at most 2 while the value is still clear; rating 1 (entity error) when the English name sounds like a different Spanish letter.** Typical cases:
  - 'em' for M, 'jay', 'double-u', 'six', 'two', also inside 'M de Madrid'.
  - These English names sound like a different Spanish letter, so the code changes: English E 'ii' = Spanish I, English A 'ei' ~ Spanish E, English J 'jay' ~ Spanish Y 'ye'.
  **Rating 1 (entity error):**
  - A name that clearly picks the other letter: 'uve' / 've corta' said for B, or 'be larga' / 'be de Barcelona' said for V.
  - A different value: 'menos cuarto' for 3:45.
  **Letters and digits that sound alike: rating 1 only if the audio itself is ambiguous between the two; do not lower the rating because your own transcription shows the other one:**
  - M/N (eme/ene), N/Ñ, F/S (efe/ese), sesenta/setenta (60/70), dos/doce (2/12).
  **Same sound, cannot be told apart from audio: never lower the rating for these alone; use the intended text to know which was meant:**
  - B and V (both /b/) when said without a distinguishing name.
  **Not wrong language, does not lower the rating:**
  - Established loanwords: email, ok, check-in.

it: |
  **Correct, does not lower the rating:**
  - Letter names in spelled codes: A a, B bi, C ci, D di, E e, F effe, G gi, H acca, I i, J i lunga (also 'gei'), K cappa, L elle, M emme, N enne, O o, P pi, Q cu, R erre, S esse, T ti, U u, V vu (also vi), W doppia vu, X ics, Y ipsilon / i greca, Z zeta. Digits zero, uno, due ... nove.
  - English bee, dee, pee, tee, vee, gee sound like the Italian names: they are not English.
  - Spelling words ('J come Jolly', 'M come Milano').
  - Dates and years: 'il primo marzo' (primo, not uno), then cardinals ('il tre marzo'); 'duemilaventisei', 'millenovecentonovanta'.
  - Times: 'le quindici e trenta', 'le tre e mezza', 'le tre meno un quarto' = 2:45.
  **English letter or digit names in a spelled code: rating at most 2 while the value is still clear; rating 1 (entity error) when the English name sounds like a different Italian letter.** Typical cases:
  - 'ay', 'ee' for E, 'eye', 'aitch', 'kay', 'ar', 'you', 'double-u', 'why', 'zee', 'six', 'two'.
  - These English names sound like a different Italian letter, so the code changes: English E 'ii' = Italian I, English A 'ei' ~ Italian E.
  **Rating 1 (entity error):**
  - A letter replaced by an ordinary word (the letter J read as the word 'Gioia' instead of 'i lunga').
  - A different value, such as a different time.
  **Unusual but understandable: rating at most 2 while the value is still clear; rating 1 if a Italian listener could take it for a different value:**
  - 'l'uno marzo' or other non-Italian date and ID formats.
  **Letters and digits that sound alike: rating 1 only if the audio itself is ambiguous between the two; do not lower the rating because your own transcription shows the other one:**
  - M/N, B/P/D/T (bi/pi/di/ti), C/G (ci/gi), F/S (effe/esse).
  **Not wrong language, does not lower the rating:**
  - Established loanwords: email, ticket, ok.

hi: |
  **Correct, does not lower the rating:**
  - Latin letters in codes said with their English names, written ए, बी, सी, डी, ई, एफ, जी, एच, आई, जे, के, एल, एम, एन, ओ, पी, क्यू, आर, एस, टी, यू, वी, डब्ल्यू, एक्स, वाई, ज़ेड: this is how Hindi names Latin letters, not wrong language.
  - Digits शून्य, एक, दो, तीन, चार, पाँच, छह, सात, आठ, नौ, or their English names ('zero', 'eight'), which are common in Indian speech.
  - Large numbers grouped by हज़ार, लाख, करोड़ (एक लाख पच्चीस हज़ार = 125,000).
  - Times: डेढ़ बजे = 1:30, ढाई बजे = 2:30, साढ़े तीन = 3:30 (साढ़े only from 3 up), सवा चार = 4:15, पौने पाँच = 4:45, 'चार बजकर बीस मिनट'.
  **Rating 1 (entity error):**
  - A digit dropped or clipped (शून्य missing or said 'शून').
  - A different value: साढ़े पाँच for 4:30, पौने चार for 4:45.
  - An English loanword or place name that a Hindi listener would not recognise (e.g. 'aisle' said as 'es-le'), when it is an entity. Loanwords and place names should sound as in Indian English. When it is not an entity, it is a wrong word: rating at most 2.
  **Unusual but understandable: rating at most 2 while the value is still clear; rating 1 if a Hindi listener could take it for a different value:**
  - An English digit name spoken where the intended or trace text spells the Hindi digit word.
  - Literal clock readings ('एक तीस' for 1:30, 'चार तीस') or 24-hour readings ('तेरह तीस'), which are non-native in conversation.
  **Letters and digits that sound alike: rating 1 only if the audio itself is ambiguous between the two; do not lower the rating because your own transcription shows the other one:**
  - सत्रह/सत्तर (17/70), उन्नीस/उनतीस/उनचास (19/29/49), सात/साठ (7/60).
  **Not wrong language, does not lower the rating:**
  - Hindi–English code-switching is supported: English words and phrases inside a Hindi sentence (flight, booking, 'last name', 'one moment'). Only a whole English sentence that is not in the intended text is wrong language.

ja: |
  **Correct, does not lower the rating:**
  - Letter names in codes in katakana, even with an English-like accent: エー, ビー, シー, ディー, イー, エフ, ジー, エイチ/エッチ, アイ, ジェー, ケー, エル, エム, エヌ, オー, ピー, キュー, アール, エス, ティー, ユー, ブイ/ヴィー, ダブリュー, エックス, ワイ, ゼット/ズィー.
  - Digits in codes: ゼロ/れい, いち, に, さん, よん, ご, ろく, なな, はち, きゅう.
  - Counter readings (し, しち, く are right here): 4時 よじ, 7時 しちじ/ななじ, 9時 くじ, 4月 しがつ, 7月 しちがつ, 9月 くがつ, 1日 ついたち, 2日 ふつか, 4日 よっか, 8日 ようか, 20日 はつか, 24日 にじゅうよっか, 1分 いっぷん, 10分 じゅっぷん/じっぷん, 2人 ふたり, 4人 よにん.
  - Years read as numbers (千九百八十八年).
  - Katakana pronunciation of English names (コンフルエンス for Confluence).
  **English letter or digit names in a spelled code: rating at most 2 while the value is still clear; rating 1 (entity error) when the English name sounds like a different Japanese letter.** Typical cases:
  - 'six', 'two'.
  **Rating 1 (entity error):**
  - A letter group read as a katakana word (INC as インク, PAR as パー) or as an English word (REQ as 'request').
  - V said ビー (B): the code changes.
  - A different word for a name (カンファレンス for Confluence), when it is an entity. When it is not an entity, it is a wrong word: rating at most 2.
  **Unusual but understandable: rating at most 2 while the value is still clear; rating 1 if a Japanese listener could take it for a different value:**
  - し (4) or しち (7) inside a code, which can be heard as シー (C) or いち (1).
  - Counter readings such as よんじ, きゅうじ, よんにち.
  - A year read digit by digit.
  **Letters and digits that sound alike: rating 1 only if the audio itself is ambiguous between the two; do not lower the rating because your own transcription shows the other one:**
  - エム/エヌ (M/N), ビー/ブイ (B/V), ディー/ティー (D/T), ジー/ゼット (G/Z).
  **Same sound, cannot be told apart from audio: never lower the rating for these alone; use the intended text to know which was meant:**
  - Q キュー and 9 きゅう.
  **Not wrong language, does not lower the rating:**
  - Katakana loanwords such as チケット, フライト; 'HR Portal' only if that is the official system name.

ko: |
  **Correct, does not lower the rating:**
  - Letter names in codes in Hangul: 에이, 비, 씨, 디, 이, 에프, 지, 에이치, 아이, 제이, 케이, 엘, 엠, 엔, 오, 피, 큐, 알, 에스, 티, 유, 브이, 더블유, 엑스, 와이, 제트/지.
  - Digits in codes in Sino-Korean: 공/영, 일, 이, 삼, 사, 오, 육, 칠, 팔, 구.
  - Native vs Sino-Korean: hours native (세 시, 열두 시), minutes Sino (삼십 분; 세 시 반 = 3:30), months Sino with 유월 (6) and 시월 (10), days Sino (십오 일), money Sino (만 오천 원), people and items native (두 명, 세 개), ages native (스물다섯 살) or Sino with 세 (이십오 세).
  **English letter or digit names in a spelled code: rating at most 2 while the value is still clear; rating 1 (entity error) when the English name sounds like a different Korean letter.** Typical cases:
  - 'six', 'two'.
  **Rating 1 (entity error):**
  - A different value.
  **Unusual but understandable: rating at most 2 while the value is still clear; rating 1 if a Korean listener could take it for a different value:**
  - Native numbers (하나, 둘) inside a code.
  - The wrong number system for a correct value ('삼 시' for 3 o'clock, '육월').
  **Letters and digits that sound alike: rating 1 only if the audio itself is ambiguous between the two; do not lower the rating because your own transcription shows the other one:**
  - 엠/엔 (M/N), 비/피 (B/P), 제이/지 (J/G), 디/티 (D/T), 일/이 (1/2), U 유 / 6 육.
  **Same sound, cannot be told apart from audio: never lower the rating for these alone; use the intended text to know which was meant:**
  - E 이 and 2 이; O 오 and 5 오; Z 지 and G 지.
  **Not wrong language, does not lower the rating:**
  - Proper nouns, official product or system names, codes and acronyms, and established loanwords written in Hangul (티켓, 이메일).
