# Per-language guidance for the user_speech_fidelity judge, rendered into its language_guidance slot.
# Based on native-speaker review of EVA runs. See src/eva/metrics/language_guidance.py.
# Generated per language from one source shared with the other speech-fidelity judges; each group
# heading states what its items mean for the rating.

de: |
  **Correct, does not lower the rating:**
  - When a code is spelled letter by letter in German, it is correct to say each letter and digit using its German name. The terms in brackets show the German pronunciation, written with German spelling conventions (not English ones). A letter or digit said this way is correct:
    - Letters: A (ah), B (beh), C (zeh), D (deh), E (eh), F (eff), G (geh), H (hah), I (ih), J (jott), K (kah), L (ell), M (emm), N (enn), O (oh), P (peh), Q (kuh), R (err), S (ess), T (teh), U (uh), V (fau), W (weh), X (iks), Y (ypsilon), Z (zett). The umlauts Ä, Ö and Ü are pronounced ä, ö and ü.
    - Digits: 0 (null), 1 (eins), 2 (zwei; 'zwo' is also a valid variant), 3 (drei), 4 (vier), 5 (fünf), 6 (sechs), 7 (sieben), 8 (acht), 9 (neun).
  - Buchstabiertafel words (e.g. 'D wie Dora', 'Z wie Zeppelin').
  - This is how times are read in German; a time read this way is correct: 'vierzehn Uhr dreißig' = 14:30, 'halb drei' = 2:30 or 14:30 (not 3:30), 'Viertel nach zwei' = 2:15 or 14:15, 'Viertel vor drei' = 2:45 or 14:45.
  - This is how dates are read in German; a date read this way is correct: 'achter November neunzehnhundertneunzig' = 8.11.1990, 'achter November sechsundzwanzig' = 8.11.26, 'zweitausendsechsundzwanzig' = 2026.
  **English letter or digit names in a spelled code: rating at most 2 while the value is still clear; rating 1 (entity error) when the English name sounds like a different German letter.** Typical cases:
  - 'bee-ell-dee' for BLD, 'jay' for J, 'dee' for D, 'six' for 6 (using English pronunciation for letter or digit names)
  - These English names sound like a different German letter, so the code changes: English E /iː/ = German I /iː/, English A /eɪ/ ~ German E /eː/, English V /viː/ is not German V /faʊ/ and starts like German W /veː/.
  **Rating 1 (entity error):**
  - A different value: siebenundfünfzig for 75, 'halb drei' for 3:30.
  **Unusual but understandable: rating at most 2 while the value is still clear; rating 1 if a German listener could take it for a different value:**
  - A date read as digit groups that a German listener cannot parse as a date ('neunzehn neunzig, zwei, Monat elf' for the date "2.11.1990").
  **Letters and digits that sound alike. Decide from the audio, not from the transcript. If the audio could be either, treat it as rating 1 (entity error), like a clearly wrong letter or digit. If the audio clearly says the intended one, it is correct, even if the transcript shows the other:**
  - D/E/G/T (deh/eh/geh/teh), B/P (beh/peh), M/N/L (emm/enn/ell), F/S (eff/ess); zwei/drei (2/3), which is why careful speakers say 'zwo'.
  **Not wrong language, does not lower the rating:**
  - Established loanwords, e.g. Ticket, Login, Account, Laptop.
  - A half-English pronunciation of a German word ('Perfekt'): this is accent.
  **Regional usage, correct when the simulated user says it (the agent should not):**
  - 'viertel drei' = 2:15 and 'drei viertel drei' = 2:45 are southern German and valid for a user.

nl: |
  **Correct, does not lower the rating:**
  - When a code is spelled letter by letter in Dutch, it is correct to say each letter and digit using its Dutch name. The terms in brackets show the Dutch pronunciation, written with Dutch spelling conventions (not English ones). A letter or digit said this way is correct:
    - Letters: A (aa), B (bee), C (cee), D (dee), E (ee), F (ef), G (gee, Dutch g), H (haa), I (ie), J (jee), K (kaa), L (el), M (em), N (en), O (oo), P (pee), Q (kuu), R (er), S (es), T (tee), U (uu), V (vee), W (wee), X (iks), Y (ij / griekse ij / ypsilon), Z (zet). IJ may be said as one letter.
    - Digits: 0 (nul), 1 (een), 2 (twee), 3 (drie), 4 (vier), 5 (vijf), 6 (zes), 7 (zeven), 8 (acht), 9 (negen).
  - Some of these are written like English names but are the Dutch ones: bee, cee, dee, pee, tee, gee, wee (Dutch B is /beː/, close to English 'bay'). Said this way, they are not English.
  - This is how numbers are read in Dutch, units before tens; a number read this way is correct: vijfenzeventig = 75, zesentwintig = 26.
  - This is how years are read in Dutch; a year read this way is correct: 2026 as 'tweeduizendzesentwintig' or 'twintig zesentwintig'.
  - This is how times are read in Dutch; a time read this way is correct: 'half drie' = 2:30 or 14:30 (not 3:30), 'kwart over twee' = 2:15 or 14:15, 'kwart voor drie' = 2:45 or 14:45, 'tien voor half drie' = 2:20 or 14:20, 'veertien uur dertig' = 14:30.
  **English letter or digit names in a spelled code: rating at most 2 while the value is still clear; rating 1 (entity error) when the English name sounds like a different Dutch letter.** Typical cases:
  - 'ay', 'aitch', 'jay', 'kay', 'ar', 'you', 'double-u', 'why', 'zee', 'six', 'one'.
  - These English names sound like a different Dutch letter, so the code changes: English E /iː/ = Dutch I /i/, English A /eɪ/ ~ Dutch E /eː/, English I /aɪ/ ~ Dutch IJ / Y /ɛi/.
  **Rating 1 (entity error):**
  - A digit said with a changed sound (vowel or consonant), so that it cannot be recognized or sounds like another digit.
  - A different value: 'half drie' for 3:30.
  **Letters and digits that sound alike. Decide from the audio, not from the transcript. If the audio could be either, treat it as rating 1 (entity error), like a clearly wrong letter or digit. If the audio clearly says the intended one, it is correct, even if the transcript shows the other:**
  - V/F (Dutch v is often devoiced), G/CH, M/N/L (em/en/el), B/P, D/T; zeven/negen (7/9), which is why telephone speech uses 'zeuven'.
  **Same sound, cannot be told apart from audio: never lower the rating for these alone; use the intended text to know which was meant:**
  - EI and IJ in names.
  **Not wrong language, does not lower the rating:**
  - Established loanwords, including 'sorry' and 'oké', which are standard Dutch.
  - An acronym used as a word or name inside a sentence (ID, FMLA, I-9) said with English letter names; Dutch names ('ie-dee') are preferred. This does not cover the letters of a spelled code or identifier: those follow the English letter names rule above.

fr: |
  **Correct, does not lower the rating:**
  - When a code is spelled letter by letter in French, it is correct to say each letter and digit using its French name. The terms in brackets show the French pronunciation, written with French spelling conventions (not English ones). A letter or digit said this way is correct:
    - Letters: A (a), B (bé), C (cé), D (dé), E (e), F (effe), G (gé), H (ache), I (i), J (ji), K (ka), L (elle), M (emme), N (enne), O (o), P (pé), Q (ku), R (erre), S (esse), T (té), U (u), V (vé), W (double-vé), X (iks), Y (i grec), Z (zède).
    - Digits: 0 (zéro), 1 (un), 2 (deux), 3 (trois), 4 (quatre), 5 (cinq), 6 (six, said 'sis'), 7 (sept), 8 (huit), 9 (neuf).
  - Some of these are written like English names but sound different: A is /a/ (as in 'papa'), E is /ə/ (as in 'le'), I is /i/ (as in 'ici'), U is /y/ (as in 'tu'), and six is said 'sis'. Said the English way ('ay', 'ee', 'eye', 'you', 'six' with a 'ks'), they are English names: see the English letter or digit names below.
  - Spelling words (e.g. 'A comme Anatole', 'M comme Marcel').
  - This is how numbers are read in French; a number read this way is correct: 70 soixante-dix, 77 soixante-dix-sept, 80 quatre-vingts, 91 quatre-vingt-onze. Use liaisons when required (six heures, dix-huit).
  - This is how times are read in French; a time read this way is correct: 'quinze heures trente' = 15:30, 'trois heures et demie' = 3:30 or 15:30, 'trois heures et quart' = 3:15 or 15:15, 'trois heures moins le quart' or 'trois heures moins quart' (without 'le', common in Québec) = 2:45 or 14:45, 'midi' = 12:00, 'minuit' = 0:00.
  - This is how dates and years are read in French; a date or year read this way is correct: 'le premier mars' = 1er mars, 'deux mille vingt-six' = 2026, 'mille neuf cent quatre-vingt-dix' or 'dix-neuf cent quatre-vingt-dix' = 1990.
  - Phone numbers read in two-digit pairs, as is usual in French ('zéro six, douze, trente-quatre…' for 06 12 34…): this is correct, not a code read as one number.
  **English letter or digit names in a spelled code: rating at most 2 while the value is still clear; rating 1 (entity error) when the English name sounds like a different French letter.** Typical cases:
  - 'bee' for B, 'jay', 'double-u', 'six' with an English 'ks', 'two', INC or EMP spelled with English names.
  - These English names sound like a different French letter, so the code changes: English G /dʒiː/ ~ French J /ʒi/, English J /dʒeɪ/ ~ French G /ʒe/, English E /iː/ = French I /i/.
  **Rating 1 (entity error):**
  - A different value: soixante-sept for 77, 'moins le quart' for 3:45.
  **Unusual but understandable: rating at most 2 while the value is still clear; rating 1 if a French listener could take it for a different value:**
  - 'le un mars' instead of 'le premier mars'.
  **Letters and digits that sound alike. Decide from the audio, not from the transcript. If the audio could be either, treat it as rating 1 (entity error), like a clearly wrong letter or digit. If the audio clearly says the intended one, it is correct, even if the transcript shows the other:**
  - M/N/L (emme/enne/elle), B/D/P/T (bé/dé/pé/té), G/J (gé/ji), F/S (effe/esse).
  **Not wrong language, does not lower the rating:**
  - Established loanwords, e.g. e-mail, week-end, OK.

es: |
  **Correct, does not lower the rating:**
  - When a code is spelled letter by letter in Spanish, it is correct to say each letter and digit using its Spanish name. The terms in brackets show the Spanish pronunciation, written with Spanish spelling conventions (not English ones). A letter or digit said this way is correct:
    - Letters: A (a), B (be), C (ce), D (de), E (e), F (efe), G (ge), H (hache), I (i, also i latina), J (jota), K (ka), L (ele), M (eme), N (ene), Ñ (eñe), O (o), P (pe), Q (cu), R (erre), S (ese), T (te), U (u), V (uve, also ve, ve chica), W (uve doble / doble uve / doble ve / doble u), X (equis), Y (i griega / ye), Z (zeta).
    - Digits: 0 (cero), 1 (uno), 2 (dos), 3 (tres), 4 (cuatro), 5 (cinco), 6 (seis), 7 (siete), 8 (ocho), 9 (nueve).
  - Some of these are written like English names but sound different: A is /a/, E is /e/ (as in 'mesa'), I is /i/, U is /u/. Said the English way ('ay', 'ee', 'eye', 'you'), they are English names: see the English letter or digit names below.
  - Spelling words (e.g. 'M de Madrid', 'B de Barcelona', 'be larga', 've corta', 've chica').
  - This is how times are read in Spanish; a time read this way is correct: 'las quince treinta' = 15:30, 'las tres y media' = 3:30 or 15:30, 'las tres y media de la mañana' = 3:30, 'las tres y media de la tarde' = 15:30, 'las tres menos cuarto' = 2:45 or 14:45.
  - This is how dates and years are read in Spanish; a date or year read this way is correct: 'el uno de marzo' and 'el primero de marzo' = 1 de marzo, 'dos mil veintiséis' = 2026, 'mil novecientos noventa' = 1990.
  **English letter or digit names in a spelled code: rating at most 2 while the value is still clear; rating 1 (entity error) when the English name sounds like a different Spanish letter.** Typical cases:
  - 'em' for M, 'jay', 'double-u', 'six', 'two', also inside 'M de Madrid'.
  - These English names sound like a different Spanish letter, so the code changes: English E /iː/ = Spanish I /i/, English A /eɪ/ ~ Spanish E /e/.
  **Rating 1 (entity error):**
  - A name that clearly picks the other letter: 'uve' / 've corta' / 've chica' said for B, or 'be larga' / 'be de Barcelona' said for V.
  - A different value: 'menos cuarto' for 3:45.
  **Letters and digits that sound alike. Decide from the audio, not from the transcript. If the audio could be either, treat it as rating 1 (entity error), like a clearly wrong letter or digit. If the audio clearly says the intended one, it is correct, even if the transcript shows the other:**
  - M/N/L (eme/ene/ele), N/Ñ, F/S (efe/ese), sesenta/setenta (60/70), dos/doce (2/12).
  **Same sound, cannot be told apart from audio: never lower the rating for these alone; use the intended text to know which was meant:**
  - B and V (both /b/) when said without a distinguishing name.
  - In names spelled by sound: G before e/i and J (both /x/), as in Gerardo/Jerardo; C before e/i and Z (both /θ/ in Spain; both /s/ with seseo, as in Latin America, the Canaries and much of Andalusia, where they also sound like S), as in Ceballos/Zeballos; C, K and QU (all /k/), as in Carla/Karla; LL and Y (yeísmo); H is silent.
  **Not wrong language, does not lower the rating:**
  - Established loanwords, e.g. email, ok, check-in.

it: |
  **Correct, does not lower the rating:**
  - When a code is spelled letter by letter in Italian, it is correct to say each letter and digit using its Italian name. The terms in brackets show the Italian pronunciation, written with Italian spelling conventions (not English ones). A letter or digit said this way is correct:
    - Letters: A (a), B (bi), C (ci), D (di), E (e), F (effe), G (gi), H (acca), I (i), J (i lunga, also 'gei'), K (cappa), L (elle), M (emme), N (enne), O (o), P (pi), Q (cu), R (erre), S (esse), T (ti), U (u), V (vu, also 'vi'), W (doppia vu, also 'vu doppia'), X (ics), Y (ipsilon, also 'i greca'), Z (zeta).
    - Digits: 0 (zero), 1 (uno), 2 (due), 3 (tre), 4 (quattro), 5 (cinque), 6 (sei), 7 (sette), 8 (otto), 9 (nove).
  - Some English names sound like these Italian ones: English bee, dee, pee, tee, vee, gee sound like Italian bi, di, pi, ti, vi, gi, so said this way they are not English. A, E, I, U are /a/, /e/, /i/, /u/; said the English way ('ay', 'ee', 'eye', 'you'), they are English names: see the English letter or digit names below.
  - Spelling words (e.g. 'J come Jolly', 'M come Milano').
  - This is how dates and years are read in Italian; a date or year read this way is correct: 'il primo marzo' = 1 marzo (primo, not uno), then cardinals ('il tre marzo' = 3 marzo); 'duemilaventisei' = 2026, 'millenovecentonovanta' = 1990.
  - This is how times are read in Italian; a time read this way is correct: 'le quindici e trenta' = 15:30, 'le tre e mezza' = 3:30 or 15:30, 'le tre meno un quarto' = 2:45 or 14:45.
  **English letter or digit names in a spelled code: rating at most 2 while the value is still clear; rating 1 (entity error) when the English name sounds like a different Italian letter.** Typical cases:
  - 'ay', 'ee' for E, 'eye', 'aitch', 'kay', 'ar', 'you', 'double-u', 'why', 'zee', 'six', 'two'.
  - These English names sound like a different Italian letter, so the code changes: English E /iː/ = Italian I /i/, English A /eɪ/ ~ Italian E /e/.
  **Rating 1 (entity error):**
  - A letter replaced by an ordinary word (the letter J read as the word 'Gioia' instead of 'i lunga').
  - A different value, such as a different time.
  **Unusual but understandable: rating at most 2 while the value is still clear; rating 1 if an Italian listener could take it for a different value:**
  - 'l'uno marzo' or other non-Italian date and ID formats.
  **Letters and digits that sound alike. Decide from the audio, not from the transcript. If the audio could be either, treat it as rating 1 (entity error), like a clearly wrong letter or digit. If the audio clearly says the intended one, it is correct, even if the transcript shows the other:**
  - M/N/L (emme/enne/elle), B/P/D/T (bi/pi/di/ti), C/G (ci/gi), F/S (effe/esse).
  **Not wrong language, does not lower the rating:**
  - Established loanwords, e.g. email, ticket, ok.

hi: |
  **Correct, does not lower the rating:**
  - These are the Hindi names of Latin letters in a spelled code; a letter said this way is correct: Hindi uses the English letter names, written ए, बी, सी, डी, ई, एफ, जी, एच, आई, जे, के, एल, एम, एन, ओ, पी, क्यू, आर, एस, टी, यू, वी, डब्ल्यू, एक्स, वाई, ज़ेड; this is not wrong language.
  - These are the Hindi digit names in a spelled code; a digit said this way is correct: शून्य, एक, दो, तीन, चार, पाँच, छह, सात, आठ, नौ. English digit names ('zero', 'eight') are also correct, since they are common in Indian speech, when the intended or trace text writes the digit as a numeral or in English.
  - This is how large numbers are read in Hindi; a number read this way is correct: grouped by हज़ार, लाख, करोड़ (एक लाख पच्चीस हज़ार = 125,000).
  - This is how times are read in Hindi; a time read this way is correct: डेढ़ बजे = 1:30, ढाई बजे = 2:30, साढ़े तीन = 3:30 (साढ़े only from 3 up), सवा चार = 4:15, पौने पाँच = 4:45, 'चार बजकर बीस मिनट'.
  **Rating 1 (entity error):**
  - A digit dropped or clipped (शून्य missing or said 'शून').
  - A different value: साढ़े पाँच for 4:30, पौने चार for 4:45.
  - An English loanword or place name that a Hindi listener would not recognize (e.g. 'aisle' said as 'es-le'), when it is an entity. Loanwords and place names should sound as in Indian English.
  **Unusual but understandable: rating at most 2 while the value is still clear; rating 1 if a Hindi listener could take it for a different value:**
  - An English digit name spoken where the intended or trace text spells out the Hindi digit word (आठ written, 'eight' spoken).
  - Literal clock readings ('एक तीस' for 1:30, 'चार तीस') or 24-hour readings ('तेरह तीस'), which are non-native in conversation.
  **Letters and digits that sound alike. Decide from the audio, not from the transcript. If the audio could be either, treat it as rating 1 (entity error), like a clearly wrong letter or digit. If the audio clearly says the intended one, it is correct, even if the transcript shows the other:**
  - सत्रह/सत्तर (17/70), उन्नीस/उनतीस/उनचास (19/29/49), सात/साठ (7/60).
  **Not wrong language, does not lower the rating:**
  - Hindi–English code-switching is supported: English words and phrases inside a Hindi sentence (e.g. flight, booking, 'last name', 'one moment'). Only a whole English sentence that is not in the intended text is wrong language.

ja: |
  **Correct, does not lower the rating:**
  - These are the Japanese names of Latin letters in a spelled code, in katakana; a letter said this way is correct, even with an English-like accent: エー, ビー, シー, ディー, イー, エフ, ジー, エイチ/エッチ, アイ, ジェー, ケー, エル, エム, エヌ, オー, ピー, キュー, アール, エス, ティー, ユー, ブイ/ヴィー, ダブリュー, エックス, ワイ, ゼット/ズィー.
  - These are the Japanese digit names in a spelled code; a digit said this way is correct: ゼロ/れい/まる, いち, に, さん, よん/し, ご, ろく, なな/しち, はち, きゅう.
  - This is how numbers are read with counters in Japanese; a number read this way is correct (し, しち, く are right here): 4時 よじ, 7時 しちじ, 9時 くじ, 4月 しがつ, 7月 しちがつ/なながつ, 9月 くがつ, 1日 ついたち, 2日 ふつか, 3日 みっか, 4日 よっか, 5日 いつか, 6日 むいか, 7日 なのか, 8日 ようか, 9日 ここのか, 10日 とおか, 14日 じゅうよっか, 20日 はつか, 24日 にじゅうよっか, 1分 いっぷん, 10分 じゅっぷん, 1人 ひとり, 2人 ふたり, 4人 よにん.
  - This is how years are read in Japanese; a year read this way is correct: as a number (千九百八十八年).
  - Katakana pronunciation of English names (コンフルエンス for Confluence).
  **English letter or digit names in a spelled code: rating at most 2 while the value is still clear; rating 1 (entity error) when the English name sounds like a different Japanese letter.** Typical cases:
  - 'six', 'two'.
  **Rating 1 (entity error):**
  - A letter group read as a katakana word (INC as インク, PAR as パー) or as an English word (REQ as 'request').
  - V said ビー (B): the code changes.
  - A different word for a name (カンファレンス for Confluence), when it is an entity.
  **Unusual but understandable: rating at most 2 while the value is still clear; rating 1 if a Japanese listener could take it for a different value:**
  - し (4) or しち (7) inside a code, which can be heard as シー (C) or いち (1).
  - Counter readings such as よんじ, きゅうじ, よんにち.
  - A year read digit by digit.
  **Letters and digits that sound alike. Decide from the audio, not from the transcript. If the audio could be either, treat it as rating 1 (entity error), like a clearly wrong letter or digit. If the audio clearly says the intended one, it is correct, even if the transcript shows the other:**
  - エム/エヌ/エル (M/N/L), ビー/ブイ (B/V), ディー/ティー (D/T), ジー/ズィー (G/Z).
  **Same sound, cannot be told apart from audio: never lower the rating for these alone; use the intended text to know which was meant:**
  - Q キュー and 9 きゅう.
  **Not wrong language, does not lower the rating:**
  - Katakana loanwords such as チケット, フライト; 'HR Portal' only if that is the official system name.

ko: |
  **Correct, does not lower the rating:**
  - These are the Korean names of Latin letters in a spelled code, in Hangul; a letter said this way is correct: 에이, 비, 씨, 디, 이, 에프, 지, 에이치, 아이, 제이, 케이, 엘, 엠, 엔, 오, 피, 큐, 알, 에스, 티, 유, 브이, 더블유, 엑스, 와이, 제트/지.
  - These are the Korean digit names in a spelled code, in Sino-Korean; a digit said this way is correct: 공/영, 일, 이, 삼, 사, 오, 육, 칠, 팔, 구.
  - This is how numbers are read in Korean, with native or Sino-Korean numbers depending on what is counted; a number read this way is correct: hours native (세 시, 열두 시), minutes Sino (삼십 분; 세 시 반 = 3:30), months Sino with 유월 (6) and 시월 (10), days Sino (십오 일), money Sino (만 오천 원), people and items native (두 명, 세 개), ages native (스물다섯 살) or Sino with 세 (이십오 세).
  **English letter or digit names in a spelled code: rating at most 2 while the value is still clear; rating 1 (entity error) when the English name sounds like a different Korean letter.** Typical cases:
  - 'six', 'two'.
  **Rating 1 (entity error):**
  - A different value.
  **Unusual but understandable: rating at most 2 while the value is still clear; rating 1 if a Korean listener could take it for a different value:**
  - Native numbers (하나, 둘) inside a code.
  - The wrong number system for a correct value ('삼 시' for 3 o'clock, '육월').
  **Letters and digits that sound alike. Decide from the audio, not from the transcript. If the audio could be either, treat it as rating 1 (entity error), like a clearly wrong letter or digit. If the audio clearly says the intended one, it is correct, even if the transcript shows the other:**
  - 엠/엔/엘 (M/N/L), 비/피 (B/P), 제이/지 (J/G), 디/티 (D/T), 일/이 (1/2), U 유 / 6 육.
  **Same sound, cannot be told apart from audio: never lower the rating for these alone; use the intended text to know which was meant:**
  - E 이 and 2 이; O 오 and 5 오; Z 지 and G 지.
  **Not wrong language, does not lower the rating:**
  - Established loanwords written in Hangul, e.g. 티켓, 이메일.
