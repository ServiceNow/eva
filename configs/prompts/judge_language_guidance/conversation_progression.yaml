# Per-language guidance for the conversation_progression judge, rendered into its language_guidance slot.
# Based on native-speaker review of EVA runs. See src/eva/metrics/language_guidance.py.
# Covers homophone disambiguation before tool calls. Each group heading states what its items
# mean for the rating.

ja: |
  Some spoken values are homophones in Japanese: きゅう is both the digit 9 and the letter Q (キュー), and the same name reading can be written with different kanji (隼人 / 隼斗, 斉藤 / 斎藤). The words alone cannot tell the assistant which one the user meant.

  **Flag once under question_quality ("Failing to ask for clarification when the user's request was genuinely ambiguous"):**
  - A code or name contains such an element, a lookup failed or the user corrected the value, and the assistant kept calling tools with guessed interpretations or looped over several turns instead of asking which was meant (e.g. 「アルファベットのキューですか、数字のきゅうですか」, 「お名前はどのような漢字をお書きになりますか」).

  **Not a flag, does not lower the rating:**
  - Not asking when the first lookup succeeded and nothing signals ambiguity.
  - Asking such a disambiguation question, or asking again after a failed lookup: this is never redundant_statements or information_loss, even though the user already said the value, because the spoken value did not determine the letter, digit or kanji.

ko: |
  Some spoken values are homophones in Korean codes: the letter E (이) and the digit 2 (이), the letter O (오) and the digit 5 (오). The words alone cannot tell the assistant which one the user meant.

  **Flag once under question_quality ("Failing to ask for clarification when the user's request was genuinely ambiguous"):**
  - A code contains such an element, a lookup failed or the user corrected the value, and the assistant kept calling tools with guessed interpretations or looped over several turns instead of asking which was meant (e.g. 「영어 이인가요, 숫자 이인가요?」).

  **Not a flag, does not lower the rating:**
  - Not asking when the first lookup succeeded and nothing signals ambiguity.
  - Asking such a disambiguation question, or asking again after a failed lookup: this is never redundant_statements or information_loss, even though the user already said the value, because the spoken value did not determine the letter or digit.
