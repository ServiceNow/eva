# Per-language guidance for the conciseness judge, rendered into its language_guidance slot.
# Based on native-speaker review of EVA runs. See src/eva/metrics/language_guidance.py.
# Language-neutral rules (one formula per function, repetition and synonym pairs are filler,
# length judged by information units, not written length) live in the shared conciseness prompt; this file only lists the
# conventions of each language, including its common backchannels. Each group heading states what its items
# mean for the rating.

fr: |
  **Cultural-norms exception: not filler, do not flag verbosity_or_filler for:**
  - The formal vous register (vouvoiement), including vous-forms and polite constructions ("Pourriez-vous me donner…", "Je vais vous demander de…").
  - Short service formulas, one per function, such as "Je vous écoute" (it hands the floor to the user, like "go ahead"), "Parfait", "Très bien", "D'accord", "Je vous en prie", "Puis-je vous aider ?", "Je vais vérifier cela pour vous", and addressing the user by name ("Très bien, Lucien").
  - Québec service register is often warmer than European French, e.g. "Excellent, Lucien !", "Ça me fait plaisir", "Pas de problème", "Je suis là pour vous aider".

  **Backchannels: not filler, do not flag verbosity_or_filler for:**
  - Short backchannels while the user is speaking or before a reply, such as "Oui", "D'accord", "Hm-hm", "Je vois", "Ah bon", "OK", including a turn that consists only of one. Québec French also uses "OK parfait" and "C'est beau".

de: |
  **Cultural-norms exception: not filler, do not flag verbosity_or_filler for:**
  - The formal Sie register, including Sie-forms and polite constructions ("Könnten Sie mir bitte … nennen?", "Darf ich Sie bitten, …").
  - Short service phrases, one per function, such as "Gerne", "Sehr gern", "Einen Moment bitte", "Vielen Dank", "Alles klar", "Ich schaue mir das gerne für Sie an".

  **Not excess length, do not flag any failure mode for it:**
  - Numbers and dates written out in words, because that is how the TTS speaks them. German compound number words look long (e.g. "am zweiundzwanzigsten April zweitausendsechsundzwanzig" for "22. April 2026") but are a single information unit.

  **Backchannels: not filler, do not flag verbosity_or_filler for:**
  - Short backchannels while the user is speaking or before a reply, such as "Ja", "Mhm", "Genau", "Okay", "Alles klar", "Ach so", including a turn that consists only of one. "Genau" is a common backchannel and does not by itself mean agreement.

es: |
  **Backchannels: not filler, do not flag verbosity_or_filler for:**
  - Short backchannels while the user is speaking or before a reply, such as "Sí", "Vale", "Ajá", "Claro", "Ya", "Entiendo", including a turn that consists only of one.

it: |
  **Backchannels: not filler, do not flag verbosity_or_filler for:**
  - Short backchannels while the user is speaking or before a reply, such as "Sì", "Certo", "Ok", "Ecco", "Capisco", "Ah", including a turn that consists only of one.

nl: |
  **Backchannels: not filler, do not flag verbosity_or_filler for:**
  - Short backchannels while the user is speaking or before a reply, such as "Ja", "Oké", "Hm-hm", "Precies", "Klopt", "Ah zo", including a turn that consists only of one.

hi: |
  **Cultural-norms exception: not filler, do not flag verbosity_or_filler for:**
  - Honorific forms (e.g. आप, -इए/-इएगा, जी as in "जी, बिल्कुल"), compound verbs ("देख लेता हूँ", "कर दिया गया है") and polite request constructions ("क्या आप कृपया… बता सकते हैं"). They make Hindi sentences longer than English ones without adding cognitive load.
  - One formula per function, such as ठीक है, जी, धन्यवाद, or नमस्ते at the opening.
  - English loanwords in normal Hindi service speech (e.g. booking, PIN, ID, ticket), in Devanagari or Latin script.

  **Backchannels: not filler, do not flag verbosity_or_filler for:**
  - Short backchannels while the user is speaking or before a reply, such as हाँ, जी, जी हाँ, अच्छा, हम्म, ठीक है, including a turn that consists only of one. जी on its own is a polite backchannel.

ko: |
  **Cultural-norms exception: not filler, do not flag verbosity_or_filler for these, even though they lengthen the sentence:**
  - Formal 합쇼체 endings (-습니다, -ㅂ니까) and polite 해요체 endings (-세요, -요), and addressing the user as 고객님.
  - Set phrases, one per function, such as 잠시만 기다려 주세요, 확인해 드리겠습니다, 감사합니다, 도와드리겠습니다.

  **Backchannels: not filler, do not flag verbosity_or_filler for:**
  - Short backchannels while the user is speaking or before a reply, such as 네, 예, 아 네, 그렇군요, 음, including a turn that consists only of one. 네 often means "I am listening", not "yes".

ja: |
  **Cultural-norms exception: not filler, do not flag verbosity_or_filler for:**
  - Keigo, and humble and honorific verb forms, which are longer than plain forms without adding cognitive load.
  - Fixed service formulas, one per function, such as かしこまりました, 恐れ入りますが, 少々お待ちください, お待たせいたしました, 確認いたします / 確認させていただきます, ありがとうございます at the opening or closing.
  - Different formulas for different functions in one turn (e.g. お待たせいたしました then 確認いたしました).

  **Backchannels: not filler, do not flag verbosity_or_filler for:**
  - Short backchannels while the user is speaking or before a reply, such as はい, ええ, そうですね, なるほど, 左様でございますか, including a turn that consists only of one. Aizuchi are expected much more often than English backchannels, and はい often means "I am listening", not "yes".
