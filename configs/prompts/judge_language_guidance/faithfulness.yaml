# Per-language guidance for the faithfulness judge, rendered into its language_guidance slot.
# Based on native-speaker review of EVA runs. See src/eva/metrics/language_guidance.py.
# Covers confusable letter and digit pairs (failing_to_disambiguate, fabricating_tool_parameters)
# and phrases in another language (wrong_language).
# Each group heading states what its items mean for the rating.

de: |
  **Letters and digits that sound alike in German; apply the shared rule on sound-alike letters and digits (failing_to_disambiguate, fabricating_tool_parameters) to them:**
  - Letter names rhyming on -e: B/D/P/T/W/G/E/C ("beh, deh, peh, teh, weh, geh, eh, tseh"); also F/S ("eff/ess") and M/N/L ("emm/enn/ell").
  - German and English letter names get mixed: J is "jott" in German but "jay" in English, which sounds close to German G "geh"; English E "ee" sounds like German I; English A "ay" like German E "eh". So J/G, D/E/G/T and E/I/A can swap between what the user said and what the tool received.
  - "zwei"/"drei" (2/3), which is why careful speakers say "zwo".
  - Two-digit numbers are spoken units first ("dreiundfünfzig" = 53): a transposition (35) or a split ("3 50") is a typical capture error.

  **Established loanwords (wrong_language): normal German, never a language violation, does not lower the rating. Examples, not a complete list:**
  - Ticket, Login, Account, E-Mail, Check-in, Gate, Upgrade, Status.

nl: |
  **Letters and digits that sound alike in Dutch; apply the shared rule on sound-alike letters and digits (failing_to_disambiguate, fabricating_tool_parameters) to them:**
  - V/F ("vee/ef"; initial v is devoiced in many accents, so a spoken V is often captured as F, e.g. V4K2R9 → F4K2R9); Z/S; G/CH (both /ɣ~x/); H/A ("haa/aa"), which can add or drop an H; B/P/D/T ("bee, pee, dee, tee").
  - IJ vs Y ("ei" vs "ypsilon / i-grec"; Y is sometimes said "ij"); EI and IJ are the same sound.
  - "zeven"/"negen" (7/9) rhyme, which is why telephone speech uses "zeuven".

  **Established loanwords (wrong_language): normal Dutch, never a language violation, does not lower the rating. Examples, not a complete list:**
  - ticket, account, e-mail, inloggen/login, check-in, gate, update.

fr: |
  **Letters and digits that sound alike in French; apply the shared rule on sound-alike letters and digits (failing_to_disambiguate, fabricating_tool_parameters) to them:**
  - Numbers 70-99 are compound and become ambiguous when split or transcribed: "soixante-dix-sept" = 77 vs "soixante, dix-sept" = 60 17; "quatre-vingt-deux" = 82 vs "4 22" / "80 2"; "quatre-vingt-dix" = 90 vs "4 20 10". A code containing such a sequence (e.g. "BRX 60 17") needs a digit-by-digit confirmation only when the conversation shows the ambiguity mattered, as in the shared rule.
  - Letter names rhyming on -é: B/C/D/G/P/T/V/W ("bé, cé, dé, gé, pé, té, vé, double-vé"); G ("gé") and J ("ji") are routinely swapped; M/N/L ("emme/enne/elle").

  **Established loanwords (wrong_language): normal French, never a language violation, does not lower the rating. Examples, not a complete list:**
  - login, e-mail, check-in, badge, mail.
  - Québec usage prefers courriel, clavardage over e-mail, chat; either choice is register, not a language violation.

es: |
  **Letters and digits that sound alike in Spanish; apply the shared rule on sound-alike letters and digits (failing_to_disambiguate, fabricating_tool_parameters) to them:**
  - B and V are the same sound /b/ (speakers disambiguate with "be larga / be de Barcelona" vs "uve / ve corta"); LL/Y merge (yeísmo); G before e/i and J are both /x/; S/C/Z merge for seseo speakers and are confusable under noise everywhere (with the European Spanish distinción, C before e/i and Z in all positions are /θ/, distinct from S /s/); C before a/o/u, K and QU are all /k/ (Carla/Karla, Quique/Kike); H is silent.
  - Letter names rhyming on -e: B/C/D/P/T ("be, ce, de, pe, te").
  - "dos"/"doce" (2/12) and "sesenta"/"setenta" (60/70) can be misheard.

  **Established loanwords (wrong_language): normal Spanish, never a language violation, does not lower the rating. Examples, not a complete list:**
  - email, login, check-in, ticket (in IT contexts and outside them, e.g. a shop receipt), online.

it: |
  **Letters and digits that sound alike in Italian; apply the shared rule on sound-alike letters and digits (failing_to_disambiguate, fabricating_tool_parameters) to them:**
  - Letter names ending in -i: B/C/D/G/P/T/V ("bi, ci, di, gi, pi, ti, vi/vu"); E/I under noise.
  - Foreign letters J ("i lunga"), K ("cappa"), W ("doppia vu"), X ("ics"), Y ("ipsilon / i greca") are often spoken with English names. Speakers spell with city names ("B come Bologna").

  **Established loanwords (wrong_language): normal Italian, never a language violation, does not lower the rating. Examples, not a complete list:**
  - password, ticket, badge, email, login, account, check-in.

ko: |
  **Letters and digits that sound alike in Korean; apply the shared rule on sound-alike letters and digits (failing_to_disambiguate, fabricating_tool_parameters) to them:**
  - Letter names: M/N/L (엠/엔/엘); G/Z (지 vs 지/제트) and J/Z (제이/제트); B/P (비/피) and D/T (디/티) under phone audio.
  - Letter/digit homophones in codes: E (이) = Sino-Korean 2 (이); the letter O (오) = 5 (오); U (유) vs 6 (육). In writing, the letter O is also easily confused with the digit 0.
  - Sino-Korean 일/이 (1/2) are a classic pair; speakers may mix native (하나, 둘) and Sino-Korean numbers.

  **Established loanwords (wrong_language): normal Korean, never a language violation, does not lower the rating. Examples, not a complete list:**
  - Hangul-written loanwords (e.g. 로그인, 티켓, 이메일, 체크인, 비밀번호 리셋).
  - Latin-script codes and acronyms (e.g. ID, PNR, OTP, EMP).
  - A transcript that renders a spoken Hangul loanword in Latin letters (e.g. "OK", "login"): this is not evidence of English speech.

hi: |
  **Letters and digits that sound alike in Hindi; apply the shared rule on sound-alike letters and digits (failing_to_disambiguate, fabricating_tool_parameters) to them:**
  - व covers both /v/ and /w/, so V/W are genuinely confusable in names spelled by sound; G (जी) and J (जे) are close in Indian-English letter names; Z may be said जेड or ज़ी.
  - Hindi number words are irregular and pairwise close: सात/साठ (7/60), सत्रह/सत्तर (17/70), उन्नीस/उनतीस (19/29), तीन/तीस (3/30). English digit names are often mixed in, and शून्य (zero) may be clipped, changing the digit count.

  **English inside Hindi (wrong_language).** Hindi–English code-switching (Hinglish) is supported.
  - Not a violation, does not lower the rating: English words and phrases inside a Hindi sentence, in Devanagari or Latin script. This covers, for example, loanwords (ID, OK, login, password, email, ticket, booking, flight, seat, account, form, mobile number, PNR), procedural terms ("Employee ID", "last name", "confirmation number") and short phrases ("six digits", "one moment").
  - A transcript that renders a spoken loanword in Latin script instead of Devanagari (e.g. "booking" for बुकिंग): this is not evidence of English speech.
  - A violation: a whole sentence or turn in English when Hindi was instructed. Rate 2 if it is an isolated fixed phrase (a hold, acknowledgement or courtesy formula, such as "One moment, please."), even when it recurs; rate 1 if it is sentences of content, a clause that carries information the user needs, or most turns. Quote it as evidence.

ja: |
  **Letters and digits that sound alike in Japanese; apply the shared rule on sound-alike letters and digits (failing_to_disambiguate, fabricating_tool_parameters) to them:**
  - Q (キュー) and 9 (きゅう) are homophones, so a code heard as "...きゅう..." (e.g. K7Q9) is genuinely ambiguous until the user says which was meant: this counts as an utterance that can be heard two ways.
  - C (シー) vs 4 (し) and 7 (しち); 7 (しち) vs 1 (いち), which is why なな is preferred for 7.
  - B/V (ビー/ブイ, often both said ビー); G (ジー), J (ジェー), Z (ゼット/ズィー) and D (ディー) collide under noise; L/R are merged in names spelled by sound. 0 may be ゼロ, れい or まる (and まる also suggests the letter O).

  **Established loanwords (wrong_language): normal Japanese, never a language violation, does not lower the rating. Examples, not a complete list:**
  - Katakana loanwords (e.g. パスワード, ログイン, チケット, ポータル, アカウント, メール).
  - Latin-letter codes and acronyms (e.g. EMP, INC, PC, ID).
  - A transcript that renders a spoken katakana loanword in Latin letters (e.g. "OK"): this is not evidence of English speech.

  **English terms in Latin script (wrong_language): rate 2, never 1:**
  - An English term where an established Japanese term exists (e.g. "HR Portal" → 人事ポータル, "sick leave" → 病気休暇). If the English term is the official system name, it is not a violation.
