# Per-language guidance for the agent_speech_fidelity judge, rendered into its language_guidance slot.
# Based on native-speaker review of EVA runs. See src/eva/metrics/language_guidance.py.

de: |
  - Letter names in spelled codes: A ah, B beh, C zeh, D deh, E eh, F eff, G geh, H hah, I ih, J jott, K kah, L ell, M emm, N enn, O oh, P peh, Q kuh, R err, S ess, T teh, U uh, V fau, W weh, X iks, Y ypsilon, Z zett; Ä/Ö/Ü as ä/ö/ü. Digits null, eins, zwei (zwo is a valid variant), drei ... neun.
  - English letter or digit names typically heard in German codes: 'bee-ell-dee' for BLD, 'jay' for J, 'dee' for D, 'six' for 6.
  - If the English name sounds like a different German letter, it changes the code: English E 'ii' = German I, English A 'ay' ~ German E, English V 'vee' ~ German W 'weh', English J 'jay' can be heard as German G 'geh': rating = 0.
  - Buchstabiertafel words are valid spelling ('D wie Dora', 'Z wie Zeppelin').
  - Confusable letters: D/E/G/T (deh/eh/geh/teh), B/P, M/N, F/S.
  - Units before tens is correct: fünfundsiebzig = 75, vierundzwanzig = 24. A swapped value (siebenundfünfzig for 75): rating = 0.
  - Times: 'vierzehn Uhr dreißig', 'halb drei' = 2:30 (not 3:30), 'Viertel nach zwei' = 2:15, 'Viertel vor drei' / 'drei viertel drei' = 2:45 are all correct; 'halb drei' for 3:30: rating = 0.
  - Dates: 'achter November neunzehnhundertneunzig', 'zweitausendsechsundzwanzig'. A date read as digit groups a German listener cannot parse as a date ('neunzehn neunzig, zwei, Monat elf'): not by itself a reason for rating = 0; rate 0 only if a German listener could take it for a different value.
  - A name with its umlaut replaced or lost (Köhler said as 'Kohler' or 'Kerr'): rating = 0. Meier/Meyer-type spelling variants are fine.
  - Not code-switching: proper nouns, official product or system names, codes and acronyms, and established loanwords (Ticket, Login, Account, Laptop). A half-English pronunciation of a German word ('Perfekt') is accent, not wrong language.

nl: |
  - Letter names in spelled codes: A aa, B bee, C cee, D dee, E ee, F ef, G gee (Dutch g), H haa, I ie, J jee, K kaa, L el, M em, N en, O oo, P pee, Q kuu, R er, S es, T tee, U uu, V vee, W wee, X iks, Y ij / griekse ij / ypsilon, Z zet; IJ may be said as one letter. Upper or lower case need not be spoken.
  - Dutch bee, cee, dee, pee, tee sound like English; do not call those English. Clearly English names ('ay', 'aitch', 'jay', 'kay', 'ar', 'you', 'double-u', 'why', 'zee') or English digits ('six', 'one') inside a Dutch turn: rating = 0 (the trace entity is not articulated in Dutch). This applies to trace entities the agent speaks; an entity that is itself English in the trace (an English street or product name) may be said in English.
  - If the English name sounds like a different Dutch letter, it changes the code: English E 'ee' = Dutch I 'ie', English A 'ay' ~ Dutch E 'ee', English I 'eye' ~ Dutch IJ: rating = 0.
  - Confusable letters: V/F (Dutch v is often devoiced), G/CH, M/N, B/P, D/T.
  - EI and IJ sound the same in names; do not flag a name only because the spelling cannot be heard.
  - Units before tens is correct: vijfenzeventig = 75, zesentwintig = 26. A vowel change that changes the digit ('veer' for vier): rating = 0.
  - 2026 as 'tweeduizendzesentwintig' or 'twintig zesentwintig' are both valid.
  - Times: 'half drie' = 2:30 (not 3:30), 'kwart over twee' = 2:15, 'kwart voor drie' = 2:45, 'tien voor half drie' = 2:20, 'veertien uur dertig' are correct; 'half drie' for 3:30: rating = 0.
  - Not code-switching: proper nouns, official product or system names, codes and acronyms, and established loanwords, including acronyms used in Dutch (ID, FMLA, I-9; Dutch letter names such as 'ie-dee' are preferred but English ones are not wrong language) and 'sorry', 'oké', which are standard Dutch.

fr: |
  - Letter names in spelled codes: A a, B bé, C cé, D dé, E e (schwa), F effe, G gé, H ache, I i, J ji, K ka, L elle, M emme, N enne, O o, P pé, Q ku, R erre, S esse, T té, U u (French u), V vé, W double-vé, X iks, Y i grec, Z zède. Digits zéro, un, deux, trois ... six (said 'sis'), sept, huit, neuf.
  - English letter or digit names typically heard in French codes: 'bee' for B, 'jay', 'double-u', 'six' with an English 'ks', 'two', INC or EMP spelled with English names.
  - If the English name sounds like a different French letter, it changes the code: English G 'djee' ~ French J 'ji', English J 'djay' ~ French G 'gé', English E 'ii' = French I: rating = 0.
  - Spelling words are valid ('A comme Anatole', 'M comme Marcel').
  - Confusable letters: M/N (emme/enne), B/D/P/T (bé/dé/pé/té), G/J (gé/ji), F/S (effe/esse).
  - Numbers: 70 soixante-dix, 77 soixante-dix-sept, 80 quatre-vingts, 91 quatre-vingt-onze are correct; a different value (soixante-sept for 77): rating = 0. Liaison and elision (six heures, dix-huit) are normal.
  - Times: 'quinze heures trente', 'trois heures et demie', 'trois heures moins le quart' = 2:45, 'midi', 'minuit' are correct; 'moins le quart' for 3:45: rating = 0.
  - Dates: 'le premier mars' is correct; 'le un mars': not by itself a reason for rating = 0; rate 0 only if a French listener could take it for a different value. Years 'deux mille vingt-six', 'mille neuf cent quatre-vingt-dix' or 'dix-neuf cent quatre-vingt-dix' are valid.
  - Established loanwords (not code-switching): ticket, e-mail, week-end, OK.

fr-CA: |
  - Québec: Z may also be said 'zed'; this is not English.
  - Contact with English does not make English letter or digit names, INC/EMP spelled in English, or English phrases acceptable; apply the rules above.
  - Times are often said on the 24-hour clock ('quinze heures trente') or as 'trois heures et quart'; both are correct.
