# Per-language guidance for the agent_speech_fidelity judge, rendered into its language_guidance slot.
# Based on native-speaker review of EVA runs. See src/eva/metrics/language_guidance.py.
# Generated per language from one source shared with the other speech-fidelity judges; each group
# heading states what its items mean for the rating.

de: |
  **Correct, does not lower the rating:**
  - These are the German names of letters and digits in a spelled code; a letter or digit said this way is correct: A ah, B beh, C zeh, D deh, E eh, F eff, G geh, H hah, I ih, J jott, K kah, L ell, M emm, N enn, O oh, P peh, Q kuh, R err, S ess, T teh, U uh, V fau, W weh, X iks, Y ypsilon, Z zett; Ä/Ö/Ü as ä/ö/ü. Digits: null, eins, zwei (zwo is a valid variant), drei ... neun.
  - Buchstabiertafel words (e.g. 'D wie Dora', 'Z wie Zeppelin').
  - This is how times are read in German; a time read this way is correct: 'vierzehn Uhr dreißig', 'halb drei' = 2:30 (not 3:30), 'Viertel nach zwei' = 2:15, 'Viertel vor drei' / 'drei viertel drei' = 2:45, and the regional 'viertel drei' = 2:15.
  - This is how dates are read in German; a date read this way is correct: 'achter November neunzehnhundertneunzig', 'zweitausendsechsundzwanzig'.
  **English letter or digit names inside a trace entity: the entity is not said in German, rating = 0.** Typical cases:
  - 'bee-ell-dee' for BLD, 'jay' for J, 'dee' for D, 'six' for 6.
  - These English names sound like a different German letter, so the code changes: English E 'ii' = German I, English A 'ay' ~ German E, English V 'vee' ~ German W 'weh', English J 'jay' ~ German G 'geh'.
  **Unusual but understandable: rating = 1; rating = 0 only if a German listener could take it for a different value:**
  - A date read as digit groups a German listener cannot parse as a date ('neunzehn neunzig, zwei, Monat elf').
  **Letters and digits that sound alike: audio that is ambiguous between the two is still rating = 0, like a clearly wrong letter or digit; do not rate 0 because your own transcription shows the other one:**
  - D/E/G/T (deh/eh/geh/teh), B/P, M/N/L (emm/enn/ell), F/S; zwei/drei (2/3), which is why careful speakers say 'zwo'.
  **Not wrong language, does not lower the rating:**
  - Established loanwords, e.g. Ticket, Login, Account, Laptop.
  - A half-English pronunciation of a German word ('Perfekt'): this is accent.

nl: |
  **Correct, does not lower the rating:**
  - These are the Dutch names of letters and digits in a spelled code; a letter or digit said this way is correct: A aa, B bee, C cee, D dee, E ee, F ef, G gee (Dutch g), H haa, I ie, J jee, K kaa, L el, M em, N en, O oo, P pee, Q kuu, R er, S es, T tee, U uu, V vee, W wee, X iks, Y ij / griekse ij / ypsilon, Z zet; IJ may be said as one letter.
  - Some of these are written like English names but are the Dutch ones: bee, cee, dee, pee, tee, gee, wee (Dutch B is /beː/, close to English 'bay'). Said this way, they are not English.
  - This is how numbers are read in Dutch, units before tens; a number read this way is correct: vijfenzeventig = 75, zesentwintig = 26.
  - This is how years are read in Dutch; a year read this way is correct: 2026 as 'tweeduizendzesentwintig' or 'twintig zesentwintig'.
  - This is how times are read in Dutch; a time read this way is correct: 'half drie' = 2:30 (not 3:30), 'kwart over twee' = 2:15, 'kwart voor drie' = 2:45, 'tien voor half drie' = 2:20, 'veertien uur dertig'.
  **English letter or digit names inside a trace entity: the entity is not said in Dutch, rating = 0.** Typical cases:
  - 'ay', 'aitch', 'jay', 'kay', 'ar', 'you', 'double-u', 'why', 'zee', 'six', 'one'.
  - These English names sound like a different Dutch letter, so the code changes: English E 'ee' = Dutch I 'ie', English A 'ay' ~ Dutch E 'ee', English I 'eye' ~ Dutch IJ.
  **Rating = 0, the entity is wrong:**
  - A vowel change that makes a digit unrecognisable or turns it into another digit.
  **Letters and digits that sound alike: audio that is ambiguous between the two is still rating = 0, like a clearly wrong letter or digit; do not rate 0 because your own transcription shows the other one:**
  - V/F (Dutch v is often devoiced), G/CH, M/N/L (em/en/el), B/P, D/T; zeven/negen (7/9), which is why telephone speech uses 'zeuven'.
  **Same sound, cannot be told apart from audio: never lower the rating for these alone; use the trace to know which was meant:**
  - EI and IJ in names.
  **Not wrong language, does not lower the rating:**
  - Established loanwords, including 'sorry' and 'oké', which are standard Dutch.
  - An acronym used as a word or name inside a sentence (ID, FMLA, I-9) said with English letter names; Dutch names ('ie-dee') are preferred. This does not cover the letters of a spelled code or identifier: those follow the English letter names rule above.

fr: |
  **Correct, does not lower the rating:**
  - These are the French names of letters and digits in a spelled code; a letter or digit said this way is correct: A a, B bé, C cé, D dé, E e, F effe, G gé, H ache, I i, J ji, K ka, L elle, M emme, N enne, O o, P pé, Q ku, R erre, S esse, T té, U u, V vé, W double-vé, X iks, Y i grec, Z zède. Digits: zéro, un, deux, trois, quatre, cinq, six, sept, huit, neuf.
  - Some of these are written like English names but sound different: A is /a/ (as in 'papa'), E is /ə/ (as in 'le'), I is /i/ (as in 'ici'), U is /y/ (as in 'tu'), and six is said 'sis'. Said the English way ('ay', 'ee', 'eye', 'you', 'six' with a 'ks'), they are English names: see the English letter or digit names below.
  - Spelling words (e.g. 'A comme Anatole', 'M comme Marcel').
  - This is how numbers are read in French; a number read this way is correct: 70 soixante-dix, 77 soixante-dix-sept, 80 quatre-vingts, 91 quatre-vingt-onze. Liaison (six heures, dix-huit).
  - This is how times are read in French; a time read this way is correct: 'quinze heures trente', 'trois heures et demie', 'trois heures et quart' = 3:15, 'trois heures moins le quart' or 'trois heures moins quart' (without 'le', common in Québec) = 2:45, 'midi', 'minuit'.
  - This is how dates and years are read in French; a date or year read this way is correct: 'le premier mars', 'deux mille vingt-six', 'mille neuf cent quatre-vingt-dix' or 'dix-neuf cent quatre-vingt-dix'.
  - Phone numbers read in two-digit pairs, as is usual in French ('zéro six, douze, trente-quatre…' for 06 12 34…): this is correct, not a code read as one number.
  **English letter or digit names inside a trace entity: the entity is not said in French, rating = 0.** Typical cases:
  - 'bee' for B, 'jay', 'double-u', 'six' with an English 'ks', 'two', INC or EMP spelled with English names.
  - These English names sound like a different French letter, so the code changes: English G 'djee' ~ French J 'ji', English J 'djay' ~ French G 'gé', English E 'ii' = French I.
  **Unusual but understandable: rating = 1; rating = 0 only if a French listener could take it for a different value:**
  - 'le un mars' instead of 'le premier mars'.
  **Letters and digits that sound alike: audio that is ambiguous between the two is still rating = 0, like a clearly wrong letter or digit; do not rate 0 because your own transcription shows the other one:**
  - M/N/L (emme/enne/elle), B/D/P/T (bé/dé/pé/té), G/J (gé/ji), F/S (effe/esse).
  **Not wrong language, does not lower the rating:**
  - Established loanwords, e.g. e-mail, week-end, OK.

es: |
  **Correct, does not lower the rating:**
  - These are the Spanish names of letters and digits in a spelled code; a letter or digit said this way is correct: A a, B be, C ce, D de, E e, F efe, G ge, H hache, I i, J jota, K ka, L ele, M eme, N ene, Ñ eñe, O o, P pe, Q cu, R erre, S ese, T te, U u, V uve (also ve), W uve doble / doble ve / doble u, X equis, Y i griega / ye, Z zeta. Digits: cero, uno, dos ... nueve.
  - Some of these are written like English names but sound different: A is /a/, E is /e/ (as in 'mesa'), I is /i/, U is /u/. Said the English way ('ay', 'ee', 'eye', 'you'), they are English names: see the English letter or digit names below.
  - Spelling words (e.g. 'M de Madrid', 'B de Barcelona', 'be larga', 've corta').
  - This is how times are read in Spanish; a time read this way is correct: 'las quince treinta', 'las tres y media', 'las tres menos cuarto' = 2:45.
  - This is how dates and years are read in Spanish; a date or year read this way is correct: 'el uno de marzo' and 'el primero de marzo', 'dos mil veintiséis', 'mil novecientos noventa'.
  **English letter or digit names inside a trace entity: the entity is not said in Spanish, rating = 0.** Typical cases:
  - 'em' for M, 'jay', 'double-u', 'six', 'two', also inside 'M de Madrid'.
  - These English names sound like a different Spanish letter, so the code changes: English E 'ii' = Spanish I, English A 'ei' ~ Spanish E, English J 'jay' ~ Spanish Y 'ye'.
  **Rating = 0, the entity is wrong:**
  - A name that clearly picks the other letter: 'uve' / 've corta' said for B, or 'be larga' / 'be de Barcelona' said for V.
  **Letters and digits that sound alike: audio that is ambiguous between the two is still rating = 0, like a clearly wrong letter or digit; do not rate 0 because your own transcription shows the other one:**
  - M/N/L (eme/ene/ele), N/Ñ, F/S (efe/ese), sesenta/setenta (60/70), dos/doce (2/12).
  **Same sound, cannot be told apart from audio: never lower the rating for these alone; use the trace to know which was meant:**
  - B and V (both /b/) when said without a distinguishing name.
  **Not wrong language, does not lower the rating:**
  - Established loanwords, e.g. email, ok, check-in.

it: |
  **Correct, does not lower the rating:**
  - These are the Italian names of letters and digits in a spelled code; a letter or digit said this way is correct: A a, B bi, C ci, D di, E e, F effe, G gi, H acca, I i, J i lunga (also 'gei'), K cappa, L elle, M emme, N enne, O o, P pi, Q cu, R erre, S esse, T ti, U u, V vu (also vi), W doppia vu, X ics, Y ipsilon / i greca, Z zeta. Digits: zero, uno, due ... nove.
  - Some English names sound like these Italian ones: English bee, dee, pee, tee, vee, gee sound like Italian bi, di, pi, ti, vi, gi, so said this way they are not English. A, E, I, U are /a/, /e/, /i/, /u/; said the English way ('ay', 'ee', 'eye', 'you'), they are English names: see the English letter or digit names below.
  - Spelling words (e.g. 'J come Jolly', 'M come Milano').
  - This is how dates and years are read in Italian; a date or year read this way is correct: 'il primo marzo' (primo, not uno), then cardinals ('il tre marzo'); 'duemilaventisei', 'millenovecentonovanta'.
  - This is how times are read in Italian; a time read this way is correct: 'le quindici e trenta', 'le tre e mezza', 'le tre meno un quarto' = 2:45.
  **English letter or digit names inside a trace entity: the entity is not said in Italian, rating = 0.** Typical cases:
  - 'ay', 'ee' for E, 'eye', 'aitch', 'kay', 'ar', 'you', 'double-u', 'why', 'zee', 'six', 'two'.
  - These English names sound like a different Italian letter, so the code changes: English E 'ii' = Italian I, English A 'ei' ~ Italian E.
  **Rating = 0, the entity is wrong:**
  - A letter replaced by an ordinary word (the letter J read as the word 'Gioia' instead of 'i lunga').
  **Unusual but understandable: rating = 1; rating = 0 only if a Italian listener could take it for a different value:**
  - 'l'uno marzo' or other non-Italian date and ID formats.
  **Letters and digits that sound alike: audio that is ambiguous between the two is still rating = 0, like a clearly wrong letter or digit; do not rate 0 because your own transcription shows the other one:**
  - M/N/L (emme/enne/elle), B/P/D/T (bi/pi/di/ti), C/G (ci/gi), F/S (effe/esse).
  **Not wrong language, does not lower the rating:**
  - Established loanwords, e.g. email, ticket, ok.

hi: |
  **Correct, does not lower the rating:**
  - These are the Hindi names of Latin letters in a spelled code; a letter said this way is correct: Hindi uses the English letter names, written ए, बी, सी, डी, ई, एफ, जी, एच, आई, जे, के, एल, एम, एन, ओ, पी, क्यू, आर, एस, टी, यू, वी, डब्ल्यू, एक्स, वाई, ज़ेड; this is not wrong language.
  - These are the Hindi digit names in a spelled code; a digit said this way is correct: शून्य, एक, दो, तीन, चार, पाँच, छह, सात, आठ, नौ. English digit names ('zero', 'eight') are also correct, since they are common in Indian speech, when the intended or trace text writes the digit as a numeral or in English.
  - This is how large numbers are read in Hindi; a number read this way is correct: grouped by हज़ार, लाख, करोड़ (एक लाख पच्चीस हज़ार = 125,000).
  - This is how times are read in Hindi; a time read this way is correct: डेढ़ बजे = 1:30, ढाई बजे = 2:30, साढ़े तीन = 3:30 (साढ़े only from 3 up), सवा चार = 4:15, पौने पाँच = 4:45, 'चार बजकर बीस मिनट'.
  **Rating = 0, the entity is wrong:**
  - A digit dropped or clipped (शून्य missing or said 'शून').
  - An English loanword or place name in a trace entity (name, place, product) that a Hindi listener would not recognise (e.g. 'aisle' said as 'es-le'). Loanwords and place names should sound as in Indian English.
  **Unusual but understandable: rating = 1; rating = 0 only if a Hindi listener could take it for a different value:**
  - An English digit name spoken where the intended or trace text spells out the Hindi digit word (आठ written, 'eight' spoken).
  - Literal clock readings ('एक तीस' for 1:30, 'चार तीस') or 24-hour readings ('तेरह तीस'), which are non-native in conversation.
  **Letters and digits that sound alike: audio that is ambiguous between the two is still rating = 0, like a clearly wrong letter or digit; do not rate 0 because your own transcription shows the other one:**
  - सत्रह/सत्तर (17/70), उन्नीस/उनतीस/उनचास (19/29/49), सात/साठ (7/60).
  **Not wrong language, does not lower the rating:**
  - Hindi–English code-switching is supported: English words and phrases inside a Hindi sentence (e.g. flight, booking, 'last name', 'one moment').

ja: |
  **Correct, does not lower the rating:**
  - These are the Japanese names of Latin letters in a spelled code, in katakana; a letter said this way is correct, even with an English-like accent: エー, ビー, シー, ディー, イー, エフ, ジー, エイチ/エッチ, アイ, ジェー, ケー, エル, エム, エヌ, オー, ピー, キュー, アール, エス, ティー, ユー, ブイ/ヴィー, ダブリュー, エックス, ワイ, ゼット/ズィー.
  - These are the Japanese digit names in a spelled code; a digit said this way is correct: ゼロ/れい, いち, に, さん, よん, ご, ろく, なな, はち, きゅう.
  - This is how numbers are read with counters in Japanese; a number read this way is correct (し, しち, く are right here): 4時 よじ, 7時 しちじ/ななじ, 9時 くじ, 4月 しがつ, 7月 しちがつ, 9月 くがつ, 1日 ついたち, 2日 ふつか, 4日 よっか, 8日 ようか, 20日 はつか, 24日 にじゅうよっか, 1分 いっぷん, 10分 じゅっぷん/じっぷん, 2人 ふたり, 4人 よにん.
  - This is how years are read in Japanese; a year read this way is correct: as a number (千九百八十八年).
  - Katakana pronunciation of English names (コンフルエンス for Confluence).
  **English letter or digit names inside a trace entity: the entity is not said in Japanese, rating = 0.** Typical cases:
  - 'six', 'two'.
  **Rating = 0, the entity is wrong:**
  - A letter group read as a katakana word (INC as インク, PAR as パー) or as an English word (REQ as 'request').
  - V said ビー (B): the code changes.
  - A different word for a trace entity (name, place, product), such as カンファレンス for Confluence.
  **Unusual but understandable: rating = 1; rating = 0 only if a Japanese listener could take it for a different value:**
  - し (4) or しち (7) inside a code, which can be heard as シー (C) or いち (1).
  - Counter readings such as よんじ, きゅうじ, よんにち.
  - A year read digit by digit.
  **Letters and digits that sound alike: audio that is ambiguous between the two is still rating = 0, like a clearly wrong letter or digit; do not rate 0 because your own transcription shows the other one:**
  - エム/エヌ/エル (M/N/L), ビー/ブイ (B/V), ディー/ティー (D/T), ジー/ゼット (G/Z).
  **Same sound, cannot be told apart from audio: never lower the rating for these alone; use the trace to know which was meant:**
  - Q キュー and 9 きゅう.
  **Not wrong language, does not lower the rating:**
  - Katakana loanwords such as チケット, フライト; 'HR Portal' only if that is the official system name.

ko: |
  **Correct, does not lower the rating:**
  - These are the Korean names of Latin letters in a spelled code, in Hangul; a letter said this way is correct: 에이, 비, 씨, 디, 이, 에프, 지, 에이치, 아이, 제이, 케이, 엘, 엠, 엔, 오, 피, 큐, 알, 에스, 티, 유, 브이, 더블유, 엑스, 와이, 제트/지.
  - These are the Korean digit names in a spelled code, in Sino-Korean; a digit said this way is correct: 공/영, 일, 이, 삼, 사, 오, 육, 칠, 팔, 구.
  - This is how numbers are read in Korean, with native or Sino-Korean numbers depending on what is counted; a number read this way is correct: hours native (세 시, 열두 시), minutes Sino (삼십 분; 세 시 반 = 3:30), months Sino with 유월 (6) and 시월 (10), days Sino (십오 일), money Sino (만 오천 원), people and items native (두 명, 세 개), ages native (스물다섯 살) or Sino with 세 (이십오 세).
  **English letter or digit names inside a trace entity: the entity is not said in Korean, rating = 0.** Typical cases:
  - 'six', 'two'.
  **Unusual but understandable: rating = 1; rating = 0 only if a Korean listener could take it for a different value:**
  - Native numbers (하나, 둘) inside a code.
  - The wrong number system for a correct value ('삼 시' for 3 o'clock, '육월').
  **Letters and digits that sound alike: audio that is ambiguous between the two is still rating = 0, like a clearly wrong letter or digit; do not rate 0 because your own transcription shows the other one:**
  - 엠/엔/엘 (M/N/L), 비/피 (B/P), 제이/지 (J/G), 디/티 (D/T), 일/이 (1/2), U 유 / 6 육.
  **Same sound, cannot be told apart from audio: never lower the rating for these alone; use the trace to know which was meant:**
  - E 이 and 2 이; O 오 and 5 오; Z 지 and G 지.
  **Not wrong language, does not lower the rating:**
  - Established loanwords written in Hangul, e.g. 티켓, 이메일.
